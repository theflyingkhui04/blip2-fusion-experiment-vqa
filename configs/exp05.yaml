model:
  name: cross_attn_fusion
  vision_width: 1024
  text_dim: 768
  hidden_size: 768
  num_query_tokens: 32
  num_layers: 3
  num_heads: 8
  intermediate_size: 3072
  fusion_output_size: 1024
  num_answers: 3129
  dropout: 0.1

data:
  data_root: /content/drive/MyDrive/blip2_project
  vqav2_dir: data/vqav2
  coco_dir: data/coco
  cache_dir: cache_mini_20k_10k
  answer_list: /content/drive/MyDrive/blip2_project/data/ans2idx.json
  train_size: 443757
  val_size: 214354
  seed: 42
  batch_size: 16
  max_question_length: 50
  image_size: 224
  num_workers: 2

training:
  output_dir: /content/drive/MyDrive/blip2_project/checkpoints/exp05
  log_dir: /content/drive/MyDrive/blip2_project/logs/exp05
  num_epochs: 10
  eval_batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 1000
  gradient_clip: 1.0
  gradient_accumulation_steps: 2
  save_every: 1
  eval_every: 1
  seed: 42
  mixed_precision: true
  resume_from: null

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  min_lr: 1.0e-6

logging:
  use_wandb: true
  project: blip2-vqa-experiment
  run_name: exp05_lan1
  wandb_run_id: null
