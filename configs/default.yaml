model:
  name: blip2_vqa
  blip2_model_name: Salesforce/blip2-opt-2.7b
  num_query_tokens: 32
  vision_width: 1024
  text_dim: 768
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  intermediate_size: 3072
  dropout: 0.1
  max_answer_length: 10
  fusion_output_size: 1024
  num_answers: 3129

data:
  data_root: data
  vqav2_dir: raw
  coco_dir: raw
  cache_dir: features
  answer_list: data/raw/answer_list.json
  train_size: 443757
  val_size: 214354
  seed: 42
  batch_size: 32
  max_question_length: 50
  image_size: 224
  num_workers: 4

training:
  output_dir: checkpoints/
  log_dir: logs/
  num_epochs: 10
  eval_batch_size: 64
  learning_rate: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 1000
  gradient_clip: 1.0
  gradient_accumulation_steps: 1
  save_every: 1
  eval_every: 1
  seed: 42
  mixed_precision: true
  resume_from: null

optimizer:
  name: adamw
  betas: [0.9, 0.999]
  eps: 1.0e-8

scheduler:
  name: cosine
  min_lr: 1.0e-6

logging:
  use_wandb: false
  project: blip2-vqa-experiment
  run_name: null
